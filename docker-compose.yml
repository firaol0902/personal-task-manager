services:
  frontend:
    build: ./frontend            
    ports:
      - "80:80"                   
    depends_on:
      - backend                  
  backend:
    build: ./backend             
    ports:
      - "5000:5000"               
    environment:
      - PORT=5000                 
      - MONGO_URI=mongodb://database:27017/taskmanager 
    depends_on:
      - database                  

  database:
    image: mongo:latest          
    ports:
      - "27017:27017"           
    volumes:
      - mongo_data:/data/db       
volumes:
  mongo_data:                     