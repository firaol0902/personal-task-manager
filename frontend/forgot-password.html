<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Forgot Password - Personal Task Manager</title>
</head>
<body>

    <div class="container">
        <h2>Forgot Password</h2>
        <p style="text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form id="forgot-form">
            <div class="form-group">
                <input type="email" id="forgot-email" placeholder="Enter your email address" required>
            </div>
            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>

        <div id="forgot-message" style="margin-top: 15px; text-align: center; font-size: 14px; font-weight: 500;"></div>

        <p class="toggle-container" style="margin-top: 20px;">
            <a href="index.html">Back to Login</a>
        </p>
    </div>

    <script src="forgot-password.js"></script>
</body>
</html>
