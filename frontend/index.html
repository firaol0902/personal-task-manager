<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Personal Task Manager</title>
</head>
<body>

    <div class="container">
        <h1>Personal Task Manager</h1>
        
        <div id="auth-section">
            <h3 id="form-title">Login</h3>
            
            <form id="auth-form">
                <div id="username-field" class="form-group">
                    <input type="text" id="username" placeholder="Username">
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                
                <div class="forgot-password-container">
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>

                <button type="submit" id="auth-btn" class="btn-primary">Login</button>
            </form>
            
            <p class="toggle-container">
                <span id="toggle-text">Don't have an account?</span> 
                <a href="#" id="toggle-auth">Register here</a>
            </p>
        </div>

        <div id="dashboard-section" style="display: none;">
            <div class="dashboard-header">
                <span id="welcome-user"></span>
                <button id="logout-btn" class="btn-danger">Logout</button>
            </div>

            <form id="task-form">
                <input type="text" id="task-title" placeholder="Add a new task..." required>
                <button type="submit" class="btn-primary">Add Task</button>
            </form>

            <h3>My Tasks</h3>
            <ul id="task-list">
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
