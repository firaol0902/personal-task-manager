<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Reset Password - Personal Task Manager</title>
</head>
<body>

    <div class="container">
        <h2>Set New Password</h2>
        <p style="text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">
            Please enter your new password below.
        </p>

        <form id="reset-form">
            <div class="form-group">
                <input type="password" id="new-password" placeholder="Enter new password" required>
            </div>
            <button type="submit" class="btn-primary">Update Password</button>
        </form>

        <div id="reset-message" style="margin-top: 15px; text-align: center; font-size: 14px; font-weight: 500;"></div>

        <p class="toggle-container" style="margin-top: 20px;">
            <a href="index.html">Back to Login</a>
        </p>
    </div>

    <script src="reset-password.js"></script>
</body>
</html>
